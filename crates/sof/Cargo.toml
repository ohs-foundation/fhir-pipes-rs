[package]
name = "fhir-pipes-sof"
version = "0.1.2"
edition = "2024"
# From octofhir/sof (https://github.com/octofhir/sof), by the OctoFHIR Team.
license = "MIT OR Apache-2.0"
authors = ["OctoFHIR Team <funyloony@gmail.com>", "Recode Labs"]
repository = "https://github.com/ohs-foundation/fhir-pipes-rs"
publish = false
description = "SQL on FHIR v2: ViewDefinition parser, PostgreSQL generator and database-free in-memory evaluator"
keywords = ["fhir", "sql-on-fhir", "healthcare", "viewdefinition", "fhirpath"]
categories = ["database", "parser-implementations"]
# The vendored conformance suite and fixtures are large and test-only; keep them
# out of the published package.
exclude = ["tests/spec/**", "tests/extra/**", "tests/fhirpath/**"]

[dependencies]
# FHIR
octofhir-fhirpath = { workspace = true }

# Database
sqlx-core = { workspace = true, optional = true }
sqlx-postgres = { workspace = true, optional = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Output formats
csv = { workspace = true }
arrow = { workspace = true, optional = true }
parquet = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }

# Async: the FHIRPath engine is async; the evaluator runs it on Tokio.
async-trait = { workspace = true }
tokio = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Tracing
tracing = { workspace = true }

[features]
default = []
parquet = ["dep:arrow", "dep:parquet", "dep:chrono"]
# Run views against FHIR resources stored as JSONB in PostgreSQL (ViewRunner).
# SQL generation (SqlGenerator) needs no database driver.
postgres = ["dep:sqlx-core", "dep:sqlx-postgres"]

[dev-dependencies]
bytes = { workspace = true }
# Reads the HL7 FHIRPath test suite (tests/fhirpath_hl7.rs).
roxmltree = "0.20"
tokio = { workspace = true }
# The fhir-pipes CLI keeps JSON object keys in order, which changes how the
# engine compares objects; test the way the CLI runs.
serde_json = { workspace = true, features = ["preserve_order"] }
