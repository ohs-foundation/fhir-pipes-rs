[package]
name = "fhir-pipes-sof-lint"
version = "0.1.2"
edition = "2024"
# From octofhir/sof (https://github.com/octofhir/sof), by the OctoFHIR Team.
license = "MIT OR Apache-2.0"
authors = ["OctoFHIR Team <funyloony@gmail.com>", "Recode Labs"]
repository = "https://github.com/ohs-foundation/fhir-pipes-rs"
publish = false
description = "Static lint and validation for SQL-on-FHIR ViewDefinitions"
keywords = ["fhir", "sql-on-fhir", "lint", "viewdefinition", "fhirpath"]
categories = ["development-tools", "parser-implementations"]

[dependencies]
fhir-pipes-sof = { workspace = true }
octofhir-fhirpath = { workspace = true }
octofhir-fhirschema = { workspace = true, optional = true }
octofhir-canonical-manager = { workspace = true, optional = true }
banshee_hir = { workspace = true, optional = true }
banshee_parser = { workspace = true, optional = true }
serde_json = { workspace = true }
thiserror = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[features]
default = []
# Lint selectors and generated SQL against a FHIR package (lint, lint_view,
# lint_sql, FhirSchemaProvider). Downloads packages over HTTP. Structure
# checks and the shareable-subset lint need none of it.
packages = [
    "dep:octofhir-fhirschema",
    "dep:octofhir-canonical-manager",
    "dep:banshee_hir",
    "dep:banshee_parser",
    "dep:thiserror",
    "dep:tracing",
]

[dev-dependencies]
tokio = { workspace = true }
