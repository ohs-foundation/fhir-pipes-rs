# cargo audit (the audit job in .github/workflows/ci.yml). A vulnerability
# always fails; so do an unmaintained or unsound crate, unless ignored here
# with the reason.

[advisories]
ignore = [
    # atomic-polyfill is unmaintained. It is in Cargo.lock only because
    # geo-types lists rstar 0.8 to 0.11 (through heapless 0.7) as optional
    # dependencies; we use rstar 0.12, and no build compiles atomic-polyfill.
    "RUSTSEC-2023-0089",
    # chrono is unmaintained (no fixed version; the advisory suggests jiff or
    # time). arrow and parquet, which write the warehouse's files, have it in
    # their API, and octofhir-fhirpath, octofhir-fhirschema and croner depend
    # on it, so moving our own uses (about 20, in serve, the warehouse and
    # the parameter checks) would not take it out of Cargo.lock. Remove this
    # when arrow and octofhir have releases without chrono, and move ours then.
    "RUSTSEC-2026-0543",
]

[output]
deny = ["unmaintained", "unsound", "yanked"]
quiet = false
