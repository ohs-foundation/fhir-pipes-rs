name: ci
# Tests run on every PR and push to main. The five optimised release builds
# are slow (LTO), and nobody uses their output until a release, so they run
# only:
#   - for a version tag (v0.3.0), which then publishes the release;
#   - when run by hand (Actions > ci > Run workflow), e.g. before tagging;
#   - for a PR or push that changes Cargo.toml, Cargo.lock, .cargo/config.toml
#     or the workflows, since dependency and build-setting changes are what
#     break cross-compiled builds;
#   - weekly, so a new toolchain that breaks a target shows up before release day.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Did this change touch what the release builds depend on?
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build: ${{ steps.filter.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            build:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/*/Cargo.toml'
              - '.cargo/config.toml'
              - '.github/workflows/**'
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets -- -D warnings
      # postgres is on by default; fhir-packages is off in releases, and a
      # build without postgres must still work.
      - if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings
      # A PostgreSQL with TLS for the database step's tests (tests/refresh_database.rs,
      # module database), which run only with this URL: every load goes over
      # an encrypted connection (sslmode=require), with the image's
      # self-signed certificate. The SQL-on-FHIR conformance suite for
      # `views run --db` (crates/sof/tests/conformance.rs) uses it too.
      - if: matrix.os == 'ubuntu-latest'
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD=test -p 5432:5432 postgres:17 \
            -c ssl=on -c ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem \
            -c ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
          for _ in $(seq 30); do docker exec pg pg_isready -U postgres && break; sleep 1; done
      # The duckdb CLI, pinned, for the tests that run SQL in DuckDB (such as
      # tests/location_hierarchy.rs); they are skipped where it is not
      # installed. The test steps set DUCKDB_AGENT_MODE=0 so duckdb runs as a
      # plain CLI.
      - if: matrix.os == 'ubuntu-latest'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/duckdb.zip" \
            https://github.com/duckdb/duckdb/releases/download/v1.5.6/duckdb_cli-linux-amd64.zip
          mkdir -p "$RUNNER_TEMP/duckdb"
          unzip -o "$RUNNER_TEMP/duckdb.zip" -d "$RUNNER_TEMP/duckdb"
          echo "$RUNNER_TEMP/duckdb" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/duckdb/duckdb" --version
      - run: cargo test --workspace --locked
        env:
          DUCKDB_AGENT_MODE: '0'
          FHIR_PIPES_TEST_DATABASE_URL: ${{ matrix.os == 'ubuntu-latest' && 'postgres://postgres:test@localhost:5432/postgres?sslmode=require' || '' }}
          SOF_CONFORMANCE_DB: ${{ matrix.os == 'ubuntu-latest' && 'postgres://postgres:test@localhost:5432/postgres?sslmode=require' || '' }}
      - if: matrix.os == 'ubuntu-latest'
        run: cargo test --workspace --locked --all-features
        env:
          DUCKDB_AGENT_MODE: '0'
          FHIR_PIPES_TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres?sslmode=require
      - if: matrix.os == 'ubuntu-latest'
        run: cargo test --workspace --locked --no-default-features
        env:
          DUCKDB_AGENT_MODE: '0'
  # Known advisories against Cargo.lock. .cargo/audit.toml sets what fails
  # (a vulnerability, an unmaintained or an unsound crate) and which are
  # ignored and why. The weekly run catches advisories published after a merge.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install --locked cargo-audit
      - run: cargo audit
  release-build:
    needs: [changes, test]
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      || github.event_name == 'workflow_dispatch'
      || github.event_name == 'schedule'
      || needs.changes.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      # One target failing should not hide whether the others build.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # aarch64 musl cross-compiles C code (zstd, lz4, and aws-lc when a
      # feature brings in an HTTPS client). Ubuntu has no aarch64 musl compiler
      # and the glibc one links glibc-only symbols, so zig compiles and links.
      - if: matrix.target == 'aarch64-unknown-linux-musl'
        run: pip install ziglang cargo-zigbuild
      - if: "!contains(matrix.target, 'musl')"
        run: cargo build --release --locked --target ${{ matrix.target }}
      - if: matrix.target == 'x86_64-unknown-linux-musl'
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
      - if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}
      - name: Rename binary for upload
        shell: bash
        run: |
          set -eu
          src="target/${{ matrix.target }}/release/fhir-pipes"
          dest="fhir-pipes-${{ matrix.target }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            src="${src}.exe"
            dest="${dest}.exe"
          fi
          mv "$src" "$dest"
          echo "BIN_PATH=$dest" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: fhir-pipes-${{ matrix.target }}
          path: ${{ env.BIN_PATH }}
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches Cargo.toml
        shell: bash
        run: |
          set -eu
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: fhir-pipes-*
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum fhir-pipes-* > SHA256SUMS && cat SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
