name: ci
on:
  push:
    branches: [main]
    # A version tag (v0.3.0) also publishes a GitHub release with the binaries.
    tags: ['v*']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The optional features (postgres, fhir-packages) are off in releases
      # but must still build and pass.
      - if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --locked
      - if: matrix.os == 'ubuntu-latest'
        run: cargo test --workspace --locked --all-features
  release-build:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      # One target failing should not hide whether the others build.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # aarch64 musl cross-compiles C code (aws-lc, brought in by the
      # octofhir-fhirpath crate's HTTP client). Ubuntu has no aarch64 musl
      # compiler and the glibc one links glibc-only symbols, so zig compiles
      # and links it instead.
      - if: matrix.target == 'aarch64-unknown-linux-musl'
        run: pip install ziglang cargo-zigbuild
      - if: "!contains(matrix.target, 'musl')"
        run: cargo build --release --locked --target ${{ matrix.target }}
      - if: matrix.target == 'x86_64-unknown-linux-musl'
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
      - if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}
      - name: Rename binary for upload
        shell: bash
        run: |
          set -eu
          src="target/${{ matrix.target }}/release/fhir-pipes"
          dest="fhir-pipes-${{ matrix.target }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            src="${src}.exe"
            dest="${dest}.exe"
          fi
          mv "$src" "$dest"
          echo "BIN_PATH=$dest" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: fhir-pipes-${{ matrix.target }}
          path: ${{ env.BIN_PATH }}
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches Cargo.toml
        shell: bash
        run: |
          set -eu
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: fhir-pipes-*
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum fhir-pipes-* > SHA256SUMS && cat SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
