[package]
name = "fhir-pipes"
version = "0.3.0"
edition = "2021"
description = "Move data into and out of FHIR servers: SQL-on-FHIR warehouses, GeoParquet, DHIS2"
license = "Apache-2.0"

[[bin]]
name = "fhir-pipes"
path = "src/main.rs"

[dependencies]
arrow-array = "59"
arrow-schema = "59"
parquet = { version = "59", default-features = false, features = ["arrow", "zstd", "snap", "lz4", "geospatial"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
geojson = "1"
geo = "0.33"
geo-types = "0.7"
wkb = "0.9"
base64 = "0.22"
sha2 = "0.11"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
url = "2.5"
uuid = { version = "1", features = ["v4"] }
geo-traits = "0.3"
tiff = { version = "0.11", default-features = false, features = ["deflate"] }
flate2 = "1.1"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
httptest = "0.16"

[profile.release]
lto = true
codegen-units = 1
strip = true
