[package]
name = "fhir-pipes"
version = "0.6.0"
edition = "2024"
description = "Move data into and out of FHIR servers: SQL-on-FHIR warehouses, GeoParquet, DHIS2"
license = "Apache-2.0"

[[bin]]
name = "fhir-pipes"
path = "src/main.rs"

# postgres is on by default and in the release binaries; fhir-packages is off.
[features]
default = ["postgres"]
# `views run --db`: run views against FHIR resources stored as JSONB in PostgreSQL;
# `refresh` with [database]: load the view tables into PostgreSQL. TLS through
# rustls and ring, as the FHIR client uses, with the webpki root certificates.
postgres = ["fhir-pipes-sof/postgres", "dep:sqlx-postgres", "dep:sqlx-core"]
# `views lint --package`: lint views against a FHIR package, downloaded over HTTP.
fhir-packages = ["fhir-pipes-sof-lint/packages"]

[dependencies]
arrow-array = "59"
arrow-schema = "59"
parquet = { version = "59", default-features = false, features = ["arrow", "zstd", "snap", "lz4", "geospatial"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
geojson = "1"
# The defaults (earcut, spade, multithreading through rayon) are unused.
geo = { version = "0.33", default-features = false }
wkb = "0.9"
base64 = "0.23"
sha2 = "0.11"
# No `gzip` feature: the client asks for gzip and decodes it itself with
# flate2's MultiGzDecoder, since reqwest's decoder reads only the first
# member of a multi-member gzip body. The client also turns reqwest's
# decoders off, in case another dependency enables them.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# RS256 signing of Google service account token requests (--google-auth);
# already in the tree through rustls.
ring = "0.17"
url = "2.5"
uuid = { version = "1", features = ["v4"] }
geo-traits = "0.3"
tiff = { version = "0.11", default-features = false, features = ["deflate"] }
flate2 = "1.1"
# Reads FHIR packages (package.tgz) for `profile check --ig`.
tar = { version = "0.4", default-features = false }
httpdate = "1"
# refresh (formerly fhir-warehouse)
anyhow = "1"
toml = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tempfile = "3"
arrow = { workspace = true }
fhir-pipes-sof = { workspace = true, features = ["parquet"] }
fhir-pipes-sof-lint = { workspace = true }
# views (formerly the octofhir-sof command-line tool)
tokio = { workspace = true }
sqlx-postgres = { workspace = true, optional = true }
sqlx-core = { workspace = true, optional = true }
annotate-snippets = "0.12.16"
glob = "0.3"
# import location-sites reads CSV.
csv = { workspace = true }
# Slugs fold accents (NFKD) the way kiln's Python slugify did; already in the
# tree through sqlx-postgres (stringprep).
unicode-normalization = "0.1"
# The global allocator (src/main.rs): faster than the system malloc for the
# many small allocations of view evaluation and the Location transform, most of
# all musl's on Linux. Built from C source with cc.
mimalloc = { version = "0.1.52", default-features = false }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
httptest = "0.16"

[profile.release]
lto = true
codegen-units = 1
strip = true

[workspace]
members = ["crates/sof", "crates/sof-lint"]

# Shared by the crates under crates/. sof came from octofhir/sof, which used
# arrow and parquet 58; it is on 59 here so the whole binary links one arrow.
[workspace.dependencies]
fhir-pipes-sof = { path = "crates/sof" }
fhir-pipes-sof-lint = { path = "crates/sof-lint" }
# 0.4.56 is the first release without an HTTP client (octofhir/fhirpath-rs#175).
octofhir-fhirpath = { version = "0.4.57", default-features = false }
octofhir-fhirschema = "0.3.29"
octofhir-canonical-manager = "0.2.4"
banshee_hir = "0.2.3"
banshee_parser = "0.2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
# octofhir-fhirpath turns on "full" itself, so a shorter list here saves nothing.
tokio = { version = "1", features = ["full"] }
sqlx-core = { version = "0.9.0", default-features = false, features = ["_rt-tokio", "json", "_tls-rustls-ring-webpki"] }
sqlx-postgres = { version = "0.9.0", default-features = false, features = ["json"] }
csv = "1.4"
# Without the defaults: arrow's are arrow-csv, arrow-json and arrow-ipc, which
# nothing uses; parquet's add brotli and simdutf8. The codecs are what we
# write (zstd in the geo outputs, snappy in views and refresh) and what QGIS,
# GDAL and DuckDB write (snappy by default; gzip and lz4 on request), so
# `diff` reads them all; zlib-rs is the gzip backend, as before.
arrow = { version = "59", default-features = false }
parquet = { version = "59", default-features = false, features = ["arrow", "snap", "zstd", "lz4", "flate2-zlib-rs"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
bytes = "1"
thiserror = "2.0"
tracing = "0.1"
