[package]
name = "fhir-pipes"
version = "0.3.0"
edition = "2024"
description = "Move data into and out of FHIR servers: SQL-on-FHIR warehouses, GeoParquet, DHIS2"
license = "Apache-2.0"

[[bin]]
name = "fhir-pipes"
path = "src/main.rs"

[dependencies]
arrow-array = "59"
arrow-schema = "59"
parquet = { version = "59", default-features = false, features = ["arrow", "zstd", "snap", "lz4", "geospatial"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
geojson = "1"
geo = "0.33"
geo-types = "0.7"
wkb = "0.9"
base64 = "0.22"
sha2 = "0.11"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
url = "2.5"
uuid = { version = "1", features = ["v4"] }
geo-traits = "0.3"
tiff = { version = "0.11", default-features = false, features = ["deflate"] }
flate2 = "1.1"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
httptest = "0.16"

[profile.release]
lto = true
codegen-units = 1
strip = true

[workspace]
members = ["crates/sof", "crates/sof-lint"]

# Shared by the crates under crates/. sof came from octofhir/sof, which used
# arrow and parquet 58; it is on 59 here so the whole binary links one arrow.
[workspace.dependencies]
fhir-pipes-sof = { path = "crates/sof" }
fhir-pipes-sof-lint = { path = "crates/sof-lint" }
octofhir-fhirpath = "0.4.46"
octofhir-fhirschema = "0.3.19"
octofhir-canonical-manager = "0.2.2"
banshee_hir = "0.1.0"
banshee_parser = "0.1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
tokio = { version = "1", features = ["full", "io-util"] }
futures-util = "0.3"
pin-project-lite = "0.2"
sqlx-core = { version = "0.9.0", default-features = false, features = ["_rt-tokio", "json"] }
sqlx-postgres = { version = "0.9.0", default-features = false, features = ["json"] }
csv = "1.4"
arrow = { version = "59" }
parquet = { version = "59", features = ["arrow", "snap", "zstd", "lz4", "flate2"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
bytes = "1"
thiserror = "2.0"
tracing = "0.1"
