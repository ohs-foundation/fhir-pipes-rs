[package]
name = "fhir-warehouse"
version = "0.1.0"
edition = "2024"
description = "Refresh a SQL-on-FHIR parquet warehouse from a FHIR server"
license = "Apache-2.0"

[[bin]]
name = "fhir-warehouse"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tempfile = "3"
# The recodelabs fork: native parquet temporal types and the parallel evaluator.
octofhir-sof = { git = "https://github.com/recodelabs/sof", branch = "main", features = ["parquet"] }
octofhir-sof-lint = { git = "https://github.com/recodelabs/sof", branch = "main" }
# Same major as octofhir-sof's, for reading the lookup tables.
arrow = { version = "58", default-features = false }
parquet = { version = "58", default-features = false, features = ["arrow", "snap", "zstd"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
