label = "task"
resource = "https://icr.healthcampaigns.org/ViewDefinition/StgTask"

[[depends_on]]
label = "beneficiary"
resource = "https://icr.healthcampaigns.org/ViewDefinition/StgBeneficiary"

[[depends_on]]
label = "member"
resource = "https://icr.healthcampaigns.org/ViewDefinition/StgHouseholdMember"
