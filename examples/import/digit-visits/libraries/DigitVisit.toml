url = "https://icr.healthcampaigns.org/Library/DigitVisit"
name = "DigitVisit"
status = "draft"
kind = "SQLQuery"
description = "DIGIT per-person tasks grouped into household visits: same round, household and worker, split where more than visitGapSeconds (by default 2 hours) pass between tasks."

[[parameter]]
name = "visitGapSeconds"
type = "integer"
documentation = "A visit ends when more than this many seconds pass between two tasks."

